[project]
name = "app"
version = "0.1.0"
description = "app service of end-to-end mlops pipeline: student performance classification"
readme = "README.md"
authors = [{ name = "RifqiAnshari1", email = "rifqi.anshari@ui.ac.id" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.43.56",
    "fastapi[standard]>=0.140.0",
    "mlflow>=3.8.1",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
    "sqlmodel>=0.0.39",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "evidently>=0.7.21",
    "ipykernel>=7.3.0",
    "kagglehub>=1.0.2",
    "optuna>=4.9.0",
    "optuna-dashboard>=0.20.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 79                        # PEP 8
indent-width = 4
target-version = "py312"
extend-exclude = ["*.ipynb", "alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP", # pyupgrade
    # "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
force-sort-within-sections = true
